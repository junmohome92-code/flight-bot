services:
  flight-bot:
    build: .
    container_name: flight-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/flight_bot.db
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    security_opt:
      - no-new-privileges:true
    volumes:
      # Host bind mount by design: rebuilding/recreating the container must not
      # move or replace the SQLite database. On the home server this resolves to
      # /data/flight-bot/data/flight_bot.db.
      - ./data:/data
    # Safe default: expose only on host loopback. Put an authenticated reverse
    # proxy in front only if a webhook endpoint must be public.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
