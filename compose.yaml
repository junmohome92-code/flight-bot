services:
  flight-bot:
    build: .
    container_name: flight-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Container-specific values are pinned here so a .env copied from a
      # Windows/local test cannot accidentally point Docker at a host path or
      # try to launch a headed browser without a display server.
      DATABASE_PATH: /data/flight_bot.db
      BROWSER_HEADLESS: "true"
      BROWSER_DEBUG_DIR: /debug
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    volumes:
      - flight_bot_data:/data
      - flight_bot_debug:/debug
    # Safe default: expose only on the host loopback interface. Put an
    # authenticated reverse proxy in front if a Kakao webhook must be public.
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"

volumes:
  flight_bot_data:
  flight_bot_debug:
