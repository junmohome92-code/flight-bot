services:
  flight-bot:
    build: .
    container_name: flight-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # Container-specific values are pinned here so a .env copied from a
      # Windows/local test cannot accidentally break the headless Ubuntu path.
      DATABASE_PATH: /data/flight_bot.db
      BROWSER_HEADLESS: "true"
      BROWSER_TIMEOUT_MS: "60000"
      BROWSER_BLOCK_ASSETS: "false"
      BROWSER_DEBUG_DIR: /debug
      SEARCH_CONCURRENCY: "${SEARCH_CONCURRENCY:-2}"
      SEARCH_STAGGER_SECONDS: "${SEARCH_STAGGER_SECONDS:-5}"
      SLOT_ACTIVE_LIMIT: "10"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    volumes:
      - flight_bot_data:/data
      - flight_bot_debug:/debug
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('HTTP_PORT','8080')+'/health',timeout=4).read()"
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3

volumes:
  flight_bot_data:
  flight_bot_debug:
