name: ci

on:
  push:
    branches: [main, "poc/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e '.[dev]'
      - name: Compile source and scripts
        run: python -m compileall -q src scripts tests
      - name: Run full test suite
        run: pytest -q
      - name: Validate installer and compose
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          cp .env.example .env
          mkdir -p data
          printf 'persist-me\n' > data/.ci-persistence-marker
          docker compose config >/tmp/compose-config.yml
          grep -q '/data' /tmp/compose-config.yml
          grep -q 'flight_bot.db' /tmp/compose-config.yml
      - name: Enforce browserless production runtime
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/flight_bot/browser_session.py
          test ! -e src/flight_bot/runtime_results_provider.py
          test ! -e src/flight_bot/google_ui_contract.py
          test -z "$(find scripts -maxdepth 1 -type f -name 'google_*' -print -quit)"
          ! grep -RniE 'from playwright|import playwright|python -m playwright|playwright>=' src Dockerfile pyproject.toml constraints.txt compose.yaml
          ! grep -RniE 'chromium|msedge|browser_headless|browser_profile|browser_debug' src Dockerfile pyproject.toml compose.yaml .env.example
      - name: Build lightweight Docker image
        run: docker build --pull -t flight-bot:ci .
      - name: Start Compose runtime and verify health plus DB persistence
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker compose logs flight-bot || true; docker compose down >/dev/null 2>&1 || true' EXIT
          docker compose up -d --build
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"version":"0.5.0"' /tmp/health.json
              grep -q '"provider":"naver-flights-sse"' /tmp/health.json
              grep -q '"browser_required":false' /tmp/health.json
              grep -q '"slots_max":20' /tmp/health.json
              grep -q '"ad_hoc_search_enabled":true' /tmp/health.json
              grep -q '"city_search_enabled":true' /tmp/health.json
              grep -q '"iata_validation_enabled":true' /tmp/health.json
              grep -q '"daily_summary_mode":"one-message-per-user"' /tmp/health.json
              test -f data/.ci-persistence-marker
              test -f data/flight_bot.db
              docker compose down
              test -f data/.ci-persistence-marker
              test -f data/flight_bot.db
              trap - EXIT
              exit 0
            fi
            sleep 1
          done
          echo 'compose health endpoint did not become ready' >&2
          exit 1

  test-windows-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Windows contract test dependency
        run: python -m pip install pytest==8.4.2
      - name: Compile browserless Naver scripts
        run: python -m compileall -q src scripts tests/test_provider_poc.py tests/test_windows_test_harness.py
      - name: Run Naver SSE and Windows launcher contracts
        run: python -m pytest -q tests/test_provider_poc.py tests/test_windows_test_harness.py
