name: ci

on:
  push:
    branches: [main, codex/playwright-v2]
  pull_request:
  workflow_dispatch:

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src scripts tests
      - run: pytest -q

  unit-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest -q
      - name: Verify Windows Playwright Chromium install and launch
        shell: pwsh
        run: |
          python -m playwright install chromium
          python -c "import asyncio; from playwright.async_api import async_playwright; exec('async def t():\n    p=await async_playwright().start()\n    b=await p.chromium.launch(headless=True)\n    print(b.version)\n    await b.close()\n    await p.stop()\nasyncio.run(t())')"

  google-flights-windows-live-diagnostic:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-google]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Test second fresh navigation of Cheapest URL
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          BROWSER_HEADLESS: "false"
          BROWSER_TIMEOUT_MS: "60000"
          BROWSER_DEBUG_DIR: artifacts/google-ui-ci
          BROWSER_PROFILE_DIR: artifacts/google-profile-ci
          BROWSER_KEEP_OPEN_SECONDS: "0"
          GOOGLE_UI_MAX_ATTEMPTS: "1"
          GOOGLE_UI_PRICE_WAIT_MS: "20000"
          GOOGLE_UI_SEARCH_URL: "https://www.google.com/travel/flights/search?tfs=CBwQAhoeEgoyMDI2LTA5LTE4agcIARIDQ0pKcgcIARIDVFBFGh4SCjIwMjYtMDktMjBqBwgBEgNUUEVyBwgBEgNDSkpAAUgBcAGCAQsI____________AZgBAQ&hl=en&gl=kr&curr=KRW"
        run: |
          cmd /c "python scripts\google_cheapest_fresh_probe.py > artifacts-ui-result.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content artifacts-ui-result.txt -Encoding UTF8
          Write-Host "probe_exit_code=$code"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-flights-windows-live-diagnostic
          path: |
            artifacts-ui-result.txt
            artifacts/google-ui-ci/
          if-no-files-found: warn
