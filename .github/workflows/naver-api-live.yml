name: naver-api-live

on:
  push:
    branches: ["poc/naver-telegram-e2e"]
    paths:
      - "scripts/naver_api_live_probe.py"
      - ".github/workflows/naver-api-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Naver Flights SSE API for CJJ-TPE round trip
        run: python scripts/naver_api_live_probe.py
