name: live-city-probe

on:
  push:
    branches: ["feat/smart-airport-city-summary"]

permissions:
  contents: read

jobs:
  live-city-sse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt .
      - name: Verify live SEL city to TYO city direct round trip
        run: |
          python scripts/naver_flight_probe.py \
            --origin SEL \
            --destination TYO \
            --depart 2026-09-22 \
            --return-date 2026-09-24 \
            --top 3 \
            --artifact-dir artifacts/live-city-probe
