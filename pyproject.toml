[project]
name = "flight-bot"
version = "0.3.0"
description = "Self-hosted Google Flights price monitor using Playwright/Chromium"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "discord.py>=2.5,<3",
  "fastapi>=0.116,<1",
  "playwright>=1.55,<2",
  "pydantic-settings>=2.10,<3",
  "python-telegram-bot>=22,<23",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
